.bar{max-width:1180px;margin:auto;display:flex;gap:8px;align-items:center}
.logo{font:800 22px Sora,sans-serif;letter-spacing:-.5px;white-space:nowrap}.logo b{color:var(--sun)}

.hb{background:rgba(255,255,255,.18);color:inherit;border:0;border-radius:10px;padding:8px 10px;white-space:nowrap;font-weight:600}

main{max-width:1180px;margin:auto;padding:16px}

.sale{background:var(--ink);color:var(--bg);border-radius:18px;padding:26px;position:relative;overflow:hidden}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:1;display:grid;place-items:center;font-size:60px;position:relative;border:0;width:100%}
.off{position:absolute;top:8px;left:8px;background:var(--hot);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px}

.price{font:700 17px Sora,sans-serif;color:var(--brand)}
.old{color:var(--muted);text-decoration:line-through;font-size:13px;margin-left:6px}
.rate,.sm{color:var(--muted);font-size:13px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:9px;padding:9px 14px;font-weight:600}

[9,"Rice Cooker 1.8L|রাইস কুকার ১.৮ লিটার","Home","🍚",2290,2890,4.5,"#D8F5E3"],[10,"Table Lamp|টেবিল ল্যাম্প","Home","💡",690,990,4.0,"#FFF0C9"],[11,"Face Serum 30ml|ফেস সিরাম ৩০মি.লি.","Beauty","🧴",890,1290,4.4,"#FFD9E8"],[12,"Lipstick Set|লিপস্টিক সেট","Beauty","💄",750,1150,4.2,"#FFD9E8"],

[17,"Bestseller Novel|বেস্টসেলার উপন্যাস","Books","📖",320,450,4.7,"#FFF0C9"],[18,"Kids Story Pack|শিশুদের গল্পের বই","Books","📚",540,700,4.5,"#DCE6FF"],[19,"Building Blocks 200pc|ব্লক সেট ২০০পিস","Toys","🧱",890,1390,4.6,"#FFE3D6"],[20,"Remote Control Car|রিমোট কন্ট্রোল গাড়ি","Toys","🚗",1190,1790,4.2,"#D5F0FF"]
].map(a=>({id:String(a[0]),name:a[1],cat:a[2],icon:a[3],price:a[4],old:a[5],rate:a[6],bg:a[7],seller:"eBuytake Mall"}));
let S={lang:"bn",users:[{name:"Admin",phone:"admin",pass:"admin123",role:"admin"}],me:null,prods:[],orders:[],rev:{},wish:[],cart:{},coupon:""};
try{Object.assign(S,JSON.parse(localStorage.getItem("ebt2")||"{}"))}catch(e){}
const F={cat:"all",q:"",sort:"rel",max:0,minr:0};
const $=id=>document.getElementById(id),bn=()=>S.lang==="bn",t=k=>D[k][bn()?1:0],tk=n=>"৳"+Number(n).toLocaleString("en-IN");
const save=()=>{try{localStorage.setItem("ebt2",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const all=()=>[...P,...S.prods],find=i=>all().find(p=>p.id===String(i));
const nm=p=>{const a=p.name.split("|");return bn()&&a[1]?a[1]:a[0]};
const rt=p=>{const r=S.rev[p.id]||[];return(p.rate*3+r.reduce((a,x)=>a+x.r,0))/(3+r.length)};
const cn=c=>c[0]==="all"?t("all"):bn()?c[2]:c[0];
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200)}
function calc(div){let sub=0;for(const k in S.cart){const p=find(k.split("|")[0]);if(p)sub+=p.price*S.cart[k]}
const disc=!sub?0:S.coupon==="EBUY10"?Math.round(sub*.1):S.coupon==="WELCOME50"?Math.min(50,sub):0;
const ship=!div||!sub||sub-disc>=999?0:div==="Dhaka"?60:120;return{sub,disc,ship,total:sub-disc+ship}}
function lang(){document.documentElement.lang=S.lang;document.querySelectorAll("[data-t]").forEach(e=>{const s=t(e.dataset.t);if(e.firstChild&&e.firstChild.nodeType===3&&e.children.length)e.firstChild.nodeValue=s;else if(!e.children.length)e.textContent=s;else e.insertBefore(document.createTextNode(s),e.firstChild)});
$("q").placeholder=t("search");$("cpn").placeholder=t("coupon");$("lg").textContent=bn()?"EN":"বাংলা";$("an").textContent=S.me?esc(S.me.name).split(" ")[0]:t("login");
$("so").innerHTML=[["rel","sort"],["lo","lo"],["hi","hi"],["top","top"]].map(o=>`<option value="${o[0]}">${t(o[1])}</option>`).join("");
$("mx").innerHTML=[[0,t("anyP")],[1000,"≤ ৳1,000"],[5000,"≤ ৳5,000"],[20000,"≤ ৳20,000"]].map(o=>`<option value="${o[0]}">${o[1]}</option>`).join("");
$("mr").innerHTML=`<option value="0">${t("anyR")}</option><option value="4">${t("r4")}</option>`;
$("so").value=F.sort;$("mx").value=F.max;$("mr").value=F.minr;cats();grid();cartR();$("wc").textContent=S.wish.length}
function cats(){$("cats").innerHTML=CATS.map(c=>`<button class="cat" data-a="cat" data-i="${c[0]}" aria-pressed="${F.cat===c[0]}"><i>${c[1]}</i><span>${cn(c)}</span></button>`).join("")}
function grid(){let l=all().filter(p=>(F.cat==="all"||p.cat===F.cat)&&nm(p).toLowerCase().includes(F.q)&&(!F.max||p.price<=F.max)&&rt(p)>=F.minr);
if(F.sort==="lo")l.sort((a,b)=>a.price-b.price);if(F.sort==="hi")l.sort((a,b)=>b.price-a.price);if(F.sort==="top")l.sort((a,b)=>rt(b)-rt(a));
$("title").textContent=cn(CATS.find(c=>c[0]===F.cat));
$("grid").innerHTML=l.length?l.map(p=>`<div class="card"><div style="position:relative"><button class="pic" style="background:${p.bg};border:0" data-a="det" data-i="${p.id}" aria-label="${esc(nm(p))}">${esc(p.icon)}</button>${p.old>p.price?`<span class="off">-${Math.round((1-p.price/p.old)*100)}%</span>`:""}<button class="heart" data-a="w" data-i="${p.id}" aria-label="Wishlist">${S.wish.includes(p.id)?"❤️":"🤍"}</button></div><div class="info"><h3>${esc(nm(p))}</h3><div><span class="price">${tk(p.price)}</span>${p.old>p.price?`<span class="old">${tk(p.old)}</span>`:""}</div><div class="rate">★ ${rt(p).toFixed(1)} · ${esc(p.seller)}</div><button class="btn" data-a="add" data-i="${p.id}">${t("add")}</button></div></div>`).join(""):`<div class="empty">${t("none")}</div>`}
function cartR(){const ks=Object.keys(S.cart).filter(k=>S.cart[k]>0&&find(k.split("|")[0]));let n=0;
$("items").innerHTML=ks.length?ks.map(k=>{const[i,o]=k.split("|"),p=find(i);n+=S.cart[k];return`<div class="row"><div class="t">${esc(p.icon)}</div><div class="n">${esc(nm(p))}${o?` <span class="sm">(${esc(o)})</span>`:""}<b>${tk(p.price)}</b></div><div class="qty"><button data-a="q" data-i="${esc(k)}" data-d="-1" aria-label="−">−</button><span>${S.cart[k]}</span><button data-a="q" data-i="${esc(k)}" data-d="1" aria-label="+">+</button></div></div>`}).join(""):`<div class="empty">${t("emptyC")}</div>`;
const c=calc();$("dc").textContent="−"+tk(c.disc);$("total").textContent=tk(c.total);$("cnt").textContent=n;save()}
function M(h){$("mod").innerHTML=`<div class="modal" data-a="mx"><div class="box" role="dialog" aria-modal="true"><button class="x" data-a="mx" aria-label="Close">✕</button>${h}</div></div>`}
const fld=(id,l,type="text",v="")=>`<label>${l}<input id="${id}" type="${type}" value="${esc(v)}"></label>`;
const stp=s=>`<div class="steps">${ST.map((x,i)=>`<span class="${i<=s?"on":""}">${x[bn()?1:0]}</span>`).join("")}</div>`;
function det(id){const p=find(id),o=OPT[p.cat],r=S.rev[p.id]||[];
M(`<div class="pd"><div class="pic" style="background:${p.bg}">${esc(p.icon)}</div><div><h3>${esc(nm(p))}</h3><div><span class="price">${tk(p.price)}</span>${p.old>p.price?`<span class="old">${tk(p.old)}</span>`:""}</div><div class="rate">★ ${rt(p).toFixed(1)} · ${t("by")}: ${esc(p.seller)}</div><p>${esc(p.desc||CD[p.cat][bn()?1:0])}</p>${o?`<label class="sm">${t("opt")}<select id="op">${o.map(x=>`<option>${x}</option>`).join("")}</select></label>`:""}<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn" data-a="add" data-i="${p.id}" data-d="1">${t("add")}</button><button class="btn hot" data-a="buy" data-i="${p.id}">${t("buy")}</button></div></div></div>
<h3 style="margin-top:16px;font-size:17px">${t("rv")}</h3>${r.length?r.map(x=>`<div class="rv">${"★".repeat(x.r)} <b>${esc(x.u)}</b><br>${esc(x.c)}</div>`).join(""):`<div class="sm">${t("noRv")}</div>`}
<div class="f"><label>${t("yr")}<select id="rr">${[5,4,3,2,1].map(n=>`<option value="${n}">${"★".repeat(n)}</option>`).join("")}</select></label><textarea id="rc" rows="2" aria-label="${t("yr")}"></textarea><button class="btn" data-a="rpost" data-i="${p.id}">${t("post")}</button></div>`)}
function auth(tab="login"){const lg=tab==="login";M(`<h3>${t(tab==="login"?"login":"reg")}</h3><div class="tabs"><button class="btn ${lg?"":"ghost"}" data-a="auth" data-i="login">${t("login")}</button><button class="btn ${lg?"ghost":""}" data-a="auth" data-i="reg">${t("reg")}</button></div><div class="f">${lg?"":fld("an2",t("name"))}${fld("ph",t("phone"),"tel")}${fld("pw",t("pass"),"password")}<button class="btn" data-a="${lg?"dologin":"doreg"}">${t(lg?"login":"reg")}</button><span class="sm">${t("hint")}</span></div>`)}
function acct(tab="orders"){if(!S.me)return auth();const ad=S.me.role==="admin";
M(`<h3>${esc(S.me.name)}</h3><div class="tabs"><button class="btn ${tab==="orders"?"":"ghost"}" data-a="acct" data-i="orders">${t("orders")}</button><button class="btn ${tab==="sell"?"":"ghost"}" data-a="acct" data-i="sell">${t("sell")}</button>${ad?`<button class="btn ${tab==="admin"?"":"ghost"}" data-a="acct" data-i="admin">${t("admin")}</button>`:""}<button class="btn ghost" data-a="logout">${t("logout")}</button></div>`+(tab==="orders"?ordList(S.orders.filter(o=>o.phone===S.me.phone),0):tab==="sell"?sellT():adminT()))}
function ordList(l,adm){return l.length?l.slice().reverse().map(o=>`<div class="ord"><b>#${o.id}</b> · ${o.date} · ${tk(o.total)}<br><span class="sm">${o.items.map(i=>esc(i.n)+"×"+i.q).join(", ")}<br>${esc(o.name)}, ${esc(o.addr)}, ${o.div} · ${o.pay}</span>${stp(o.st)}${adm&&o.st<3?`<button class="btn" data-a="nx" data-i="${o.id}">${t("next")}</button>`:""}</div>`).join(""):`<div class="sm">${t("noOrd")}</div>`}
function sellT(){const sh=S.me.shop||"",mine=S.prods.filter(p=>p.seller===sh&&sh);let sl=0;S.orders.forEach(o=>o.items.forEach(i=>{if(sh&&i.s===sh)sl+=i.p*i.q}));
return`<div class="f">${fld("shn",t("shopN"),"text",sh)}${sh?`<div class="stat"><div><span class="sm">${t("sales")}</span><b>${tk(sl)}</b></div><div><span class="sm">${t("net")}</span><b>${tk(Math.round(sl*.92))}</b></div></div><span class="sm">${t("comm")}</span>`:""}
${fld("pn",t("pn"))}${fld("pp",t("pp"),"number")}${fld("po",t("po"),"number")}${fld("pe",t("pe"),"text","🎁")}<label>${t("pc")}<select id="pcat">${CATS.slice(1).map(c=>`<option value="${c[0]}">${cn(c)}</option>`).join("")}</select></label><label>${t("pd")}<textarea id="pdd" rows="2"></textarea></label><button class="btn" data-a="addp">${t("save")}</button></div>
<h3 style="font-size:17px">${t("my")}</h3>${mine.map(p=>`<div class="rv">${esc(p.icon)} ${esc(nm(p))} · ${tk(p.price)} <button class="btn ghost" data-a="delp" data-i="${p.id}">${t("del")}</button></div>`).join("")}`}
function adminT(){const rv=S.orders.reduce((a,o)=>a+o.total,0);return`<div class="stat"><div><span class="sm">${t("rev")}</span><b>${tk(rv)}</b></div><div><span class="sm">${t("oc")}</span><b>${S.orders.length}</b></div><div><span class="sm">${t("uc")}</span><b>${S.users.length-1}</b></div><div><span class="sm">${t("pc2")}</span><b>${all().length}</b></div></div>${ordList(S.orders,1)}<h3 style="font-size:17px">${t("pc2")}</h3>${S.prods.map(p=>`<div class="rv">${esc(p.icon)} ${esc(nm(p))} · ${esc(p.seller)} <button class="btn ghost" data-a="delp" data-i="${p.id}">${t("del")}</button></div>`).join("")}`}
function chk(){if(!Object.keys(S.cart).length)return toast(t("emptyC"));if(!S.me){toast(t("needLogin"));return auth()}
$("cart").classList.remove("open");const c=calc();
M(`<h3>${t("checkout")}</h3><div class="f">${fld("cn",t("name"),"text",S.me.name)}${fld("cp",t("phone"),"tel",S.me.phone==="admin"?"":S.me.phone)}<label>${t("addr")}<textarea id="ca" rows="2"></textarea></label><label>${t("div")}<select id="cd">${DIV.map(d=>`<option>${d}</option>`).join("")}</select></label>
<div class="pay">${[["COD",t("cod")],["bKash","bKash"],["Nagad","Nagad"],["Card",t("card")]].map((p,i)=>`<label><input type="radio" name="pm" value="${p[0]}" ${i?"":"checked"}>${p[1]}</label>`).join("")}</div><div id="tx" class="sm" hidden>${t("trx")}<input id="tid" style="width:100%"></div>
<div class="tl"><span>${t("sub")}</span><span>${tk(c.sub)}</span></div><div class="tl"><span>${t("disc")}</span><span>−${tk(c.disc)}</span></div><div class="tl"><span>${t("ship")}</span><span id="sh">${tk(c.ship?c.ship:60)}</span></div><div class="tl b"><span>${t("total")}</span><span id="ct">${tk(calc("Dhaka").total)}</span></div><button class="btn hot" data-a="place">${t("place")}</button></div>`)}
function place(){const n=$("cn").value.trim(),ph=$("cp").value.trim(),ad=$("ca").value.trim(),dv=$("cd").value,pm=document.querySelector("[name=pm]:checked").value;
if(!n||!ph||!ad)return toast(t("fill"));if(pm!=="COD"&&!$("tid").value.trim())return toast(t("fill"));
const c=calc(dv),id="EB"+(1001+S.orders.length);
const items=Object.keys(S.cart).filter(k=>find(k.split("|")[0])).map(k=>{const p=find(k.split("|")[0]);return{n:nm(p)+(k.split("|")[1]?" ("+k.split("|")[1]+")":""),q:S.cart[k],p:p.price,s:p.seller}});
S.orders.push({id,phone:S.me.phone,name:n,addr:ad,div:dv,pay:pm,items,total:c.total,st:0,date:new Date().toLocaleDateString("en-GB")});
S.cart={};S.coupon="";save();cartR();M(`<h3>✅ ${t("ok")}</h3><p><b>#${id}</b> · ${tk(c.total)}</p>${stp(0)}<p class="sm">${t("sms")} ${esc(ph)}</p>`);toast(t("sms")+" "+ph)}
const A={
cat:i=>{F.cat=i;cats();grid()},shop:()=>$("shop").scrollIntoView({behavior:"smooth"}),lang:()=>{S.lang=bn()?"en":"bn";save();lang()},
add:(i,b)=>{const o=$("op"),k=i+(o&&b.dataset.d?"|"+o.value:"");S.cart[k]=(S.cart[k]||0)+1;cartR();toast(t("added"))},
buy:i=>{const o=$("op"),k=i+(o?"|"+o.value:"");S.cart[k]=(S.cart[k]||0)+1;cartR();A.mx(0,0,{target:{}});chk()},
q:(k,b)=>{S.cart[k]=Math.max(0,(S.cart[k]||0)+Number(b.dataset.d));if(!S.cart[k])delete S.cart[k];cartR()},
cart:()=>$("cart").classList.add("open"),cartx:()=>$("cart").classList.remove("open"),
coupon:()=>{const v=$("cpn").value.trim().toUpperCase();S.coupon=["EBUY10","WELCOME50"].includes(v)?v:"";cartR();toast(S.coupon?"✓ "+v:"✗")},
chk,place,det,acct:i=>acct(i),auth:i=>auth(i),
w:i=>{S.wish=S.wish.includes(i)?S.wish.filter(x=>x!==i):[...S.wish,i];save();$("wc").textContent=S.wish.length;grid()},
wish:()=>{const l=S.wish.map(find).filter(Boolean);M(`<h3>${t("wl")}</h3>${l.length?l.map(p=>`<div class="rv">${esc(p.icon)} ${esc(nm(p))} · ${tk(p.price)} <button class="btn" data-a="add" data-i="${p.id}">${t("add")}</button></div>`).join(""):`<div class="sm">${t("noW")}</div>`}`)},
dologin:()=>{const u=S.users.find(x=>x.phone===$("ph").value.trim()&&x.pass===$("pw").value);if(!u)return toast(t("bad"));S.me=u;save();lang();acct()},
doreg:()=>{const n=$("an2").value.trim(),p=$("ph").value.trim(),w=$("pw").value;if(!n||!p||w.length<4)return toast(t("fill"));if(S.users.some(x=>x.phone===p))return toast(t("exists"));const u={name:n,phone:p,pass:w,role:"user"};S.users.push(u);S.me=u;save();lang();acct()},
logout:()=>{S.me=null;save();lang();A.mx(0,0,{target:{}})},
rpost:i=>{if(!S.me){toast(t("needLogin"));return auth()}const c=$("rc").value.trim();if(!c)return toast(t("fill"));(S.rev[i]=S.rev[i]||[]).push({u:S.me.name,r:Number($("rr").value),c});save();grid();det(i)},
nx:i=>{const o=S.orders.find(x=>x.id===i);if(o&&o.st<3){o.st++;save();toast(t("sms")+" "+o.phone)}acct("admin")},
addp:()=>{const sh=$("shn").value.trim(),n=$("pn").value.trim(),pr=Number($("pp").value),od=Number($("po").value)||pr;if(!sh||!n||!pr)return toast(t("fill"));S.me.shop=sh;const u=S.users.find(x=>x.phone===S.me.phone);if(u)u.shop=sh;
const bg=["#DCE6FF","#FFE3D6","#D8F5E3","#FFF0C9","#FFD9E8"][S.prods.length%5];S.prods.push({id:"s"+Date.now(),name:n,cat:$("pcat").value,icon:$("pe").value||"🎁",price:pr,old:od,rate:4,bg,seller:sh,desc:$("pdd").value.trim()});save();grid();toast("✓");acct("sell")},
delp:i=>{S.prods=S.prods.filter(p=>p.id!==i);save();grid();acct(S.me.role==="admin"?"admin":"sell")},
pol:i=>M(`<h3>${t(i)}</h3><p>${PO[i][bn()?1:0]}</p>`),
mx:(i,b,e)=>{if(e.target===b||e.target.classList&&e.target.classList.contains("x")||!e.target.closest)$("mod").innerHTML=""}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const f=A[b.dataset.a];if(!f)return;if(b.dataset.a==="mx"&&e.target!==b&&!e.target.classList.contains("x"))return;f(b.dataset.i,b,e)});
document.addEventListener("change",e=>{const x=e.target;if(x.id==="so"){F.sort=x.value;grid()}if(x.id==="mx"){F.max=Number(x.value);grid()}if(x.id==="mr"){F.minr=Number(x.value);grid()}
if(x.id==="cd"){const c=calc(x.value);$("sh").textContent=tk(c.ship);$("ct").textContent=tk(c.total)}if(x.name==="pm")$("tx").hidden=x.value==="COD"});
$("q").oninput=e=>{F.q=e.target.value.trim().toLowerCase();grid()};
function tick(){const d=new Date(),e=new Date(d);e.setHours(23,59,59,0);const s=Math.max(0,Math.floor((e-d)/1000)),f=n=>String(n).padStart(2,"0");
$("h").firstChild.nodeValue=f(Math.floor(s/3600));$("m").firstChild.nodeValue=f(Math.floor(s%3600/60));$("s").firstChild.nodeValue=f(s%60)}
lang();tick();setInterval(tick,1000);
</script>
